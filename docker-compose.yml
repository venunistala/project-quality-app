services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quality_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quality_lab}
      POSTGRES_DB: ${POSTGRES_DB:-quality_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quality_lab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quality_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quality_lab_pg_data:
